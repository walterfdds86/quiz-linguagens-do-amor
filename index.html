<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - As 5 Linguagens do Amor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;1,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--berry:#6D2E46;--deep:#55243A;--rose:#A26769;--blush:#F1E4E6;--ink:#473640;--muted:#8C7A82;--white:#FFFFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Karla',sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--deep) 0%,var(--berry) 55%,#7d3a52 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--white);width:100%;max-width:540px;border-radius:22px;box-shadow:0 18px 50px rgba(40,12,25,.35);overflow:hidden}
.inner{padding:30px 26px 28px}
.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:.68rem;font-weight:700;color:var(--rose);text-align:center;margin-bottom:4px}
.hearts{display:flex;justify-content:center;margin-bottom:10px}
.hearts svg{width:30px;height:30px}.hearts svg:last-child{margin-left:-9px}
.progress-wrap{display:flex;align-items:center;gap:12px;margin:14px 0 22px}
.progress{flex:1;height:8px;background:var(--blush);border-radius:99px;overflow:hidden}
.progress>div{height:100%;width:0%;background:var(--rose);border-radius:99px;transition:width .35s ease}
.count{font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap}
.qtitle{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--berry);text-align:center;margin-bottom:4px}
.qsub{text-align:center;color:var(--muted);font-size:.84rem;margin-bottom:20px}
.opt{display:block;width:100%;text-align:left;background:var(--blush);border:2px solid transparent;border-radius:16px;padding:18px;margin-bottom:13px;cursor:pointer;font:500 1rem/1.5 'Karla',sans-serif;color:var(--ink);transition:border-color .15s,background .15s,transform .12s}
.opt:hover{border-color:var(--rose)}.opt:active{transform:scale(.985)}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.result-name{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:4px}
.result-lang{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:700;color:var(--berry);text-align:center;line-height:1.25;margin-bottom:14px}
.result-desc{background:var(--blush);border-radius:14px;padding:15px 17px;font-size:.92rem;line-height:1.6;margin-bottom:20px}
.result-desc strong{color:var(--berry)}
.bar-row{margin-bottom:11px}
.bar-label{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;margin-bottom:5px}
.bar-label span:last-child{color:var(--muted);font-weight:500}
.bar{height:10px;background:var(--blush);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--rose);border-radius:99px;width:0%;transition:width .8s ease .15s}
.bar.top>div{background:var(--berry)}
.days-title{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:700;color:var(--berry);margin:20px 0 4px;text-align:center}
.days-sub{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:12px}
.day-row{display:flex;align-items:flex-start;gap:10px;background:var(--blush);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.day-badge{flex:none;background:var(--berry);color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.04em;border-radius:99px;padding:4px 9px;margin-top:1px;white-space:nowrap}
.day-text{font-size:.86rem;line-height:1.45}
.btn{display:block;width:100%;margin-top:18px;padding:14px;border:none;border-radius:14px;background:#1faa55;color:#fff;font:700 1rem 'Karla',sans-serif;cursor:pointer;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(.92)}.btn:active{transform:scale(.98)}
.btn.secondary{background:transparent;color:var(--berry);border:1.5px solid var(--berry);margin-top:10px}
.footer-note{text-align:center;font-size:.74rem;color:var(--muted);margin-top:14px;font-style:italic}
</style>
</head>
<body>
<main class="card" id="app"></main>
<script>
var LANGS={A:{n:"Palavras de Afirmacao",e:"💬",d:"Voce se sente amado(a) atraves de elogios sinceros, encorajamento e reconhecimento.",eu:"atraves de palavras: elogios sinceros e reconhecimento."},B:{n:"Tempo de Qualidade",e:"⏰",d:"Voce se sente amado(a) com atencao total. Presenca verdadeira: olho no olho, conversa de verdade.",eu:"com atencao total. Preciso de momentos so nossos."},C:{n:"Presentes",e:"🎁",d:"Voce se sente amado(a) com gestos visiveis de cuidado. Nao e o valor, e a mensagem: eu pensei em voce.",eu:"com gestos visiveis de cuidado."},D:{n:"Atos de Servico",e:"🤝",d:"Para voce, amor e ajuda pratica. Quando seu conjuge assume uma tarefa, isso comunica amor.",eu:"atraves de ajuda pratica. Quando voce cuida de mim, isso me comunica amor."},E:{n:"Toque Fisico",e:"🤗",d:"Voce se sente amado(a) com proximidade fisica: abracos, maos dadas, um carinho ao passar.",eu:"com proximidade fisica: abracos e maos dadas."}};
var CK={A:["Me elogie com algo especifico hoje","Diga eu te amo antes de sair","Me envie mensagem carinhosa no meio do dia","Agradeca algo que eu fiz","Reconheca um esforco meu em voz alta","Deixe um bilhete escrito a mao","Corrija-me com gentileza"],B:["Reserve 15min de conversa sem celular","Planeje um encontro a dois","Faca uma refeicao comigo com atencao","Pergunte como foi meu dia e escute","Faca comigo algo que eu gosto","Caminhe comigo","Guarde o celular quando eu estiver falando"],C:["Me surpreenda com lembrancinha","Traga meu doce favorito","Anote o que eu menciono querer","Marque nossas datas especiais","Capriche na entrega","Traga algo simbolico quando viajar","Faca um presente com as proprias maos"],D:["Assuma uma tarefa sem eu pedir","Prepare cafe ou refeicao para mim","Resolva algo pendente","Me ajude com as criancas","Cuide de um detalhe pratico","Pergunte: posso fazer algo por voce?","Cumpra o que prometeu"],E:["Me abrace ao chegar e ao sair","Ande de maos dadas comigo","Sente-se pertinho de mim","Faca um cafune sem pressa","Me de um beijo de bom dia e boa noite","Toque meu ombro ao passar","Vamos adormecer abracados"]};
var QS=[["A","Receber um elogio sincero.","B","Ter um tempo so nosso."],["C","Ganhar uma lembrancinha.","D","Ver meu conjuge me ajudando sem eu pedir."],["E","Receber um abraco demorado.","A","Ouvir: eu tenho orgulho de voce."],["B","Fazer um passeio a dois.","C","Receber um presente com cuidado."],["D","Chegar e ver que meu conjuge resolveu algo.","E","Andar de maos dadas."],["A","Receber mensagem carinhosa.","C","Encontrar uma surpresinha."],["B","Conversar profundamente.","D","Ter ajuda quando estou sobrecarregado(a)."],["E","Receber carinho enquanto assistimos algo.","B","Ter a atencao total do meu conjuge."],["A","Ser encorajado(a) quando inseguro(a).","D","Ver meu conjuge facilitando minha vida."],["C","Ver que meu conjuge guardou algo que mencionei.","E","Adormecer abracados."]];
var idx=0,pl={A:0,B:0,C:0,D:0,E:0},app=document.getElementById("app");
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function hts(){var d=mk("div","hearts");["#A26769","#F1E4E6"].forEach(function(c){var s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 24 24");var p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("fill",c);p.setAttribute("d","M12 21s-7.5-4.9-10-9.2C.4 8.6 2 5 5.5 5 7.7 5 9.3 6.3 12 9c2.7-2.7 4.3-4 6.5-4C22 5 23.6 8.6 22 11.8 19.5 16.1 12 21 12 21z");s.appendChild(p);d.appendChild(s);});return d;}
function responder(l){pl[l]++;idx++;idx<QS.length?telaPergunta():telaResultado();}
function telaPergunta(){
var q=QS[idx],pct=Math.round(idx/QS.length*100),ops=idx%2===1?[[q[2],q[3]],[q[0],q[1]]]:[[q[0],q[1]],[q[2],q[3]]];
var d=mk("div","inner fade");d.appendChild(hts());d.appendChild(mk("p","eyebrow","As 5 Linguagens do Amor"));
var pw=mk("div","progress-wrap");var pr=mk("div","progress");var pb=mk("div");pb.id="pb";pr.appendChild(pb);pw.appendChild(pr);pw.appendChild(mk("span","count",(idx+1)+" / "+QS.length));d.appendChild(pw);
d.appendChild(mk("p","qtitle","E mais significativo para mim..."));d.appendChild(mk("p","qsub","Toque na opcao que mais fala ao seu coracao:"));
ops.forEach(function(o){var b=mk("button","opt",o[1]);b.dataset.l=o[0];b.addEventListener("click",function(){responder(this.dataset.l);});d.appendChild(b);});
app.innerHTML="";app.appendChild(d);
requestAnimationFrame(function(){var b=document.getElementById("pb");if(b)b.style.width=pct+"%";});
}
function telaResultado(){
var ord=Object.entries(pl).sort(function(a,b){return b[1]-a[1];});var top=ord[0][0],L=LANGS[top],MAX=4;
var d=mk("div","inner fade");d.appendChild(hts());d.appendChild(mk("p","eyebrow","Resultado"));
d.appendChild(mk("p","result-name","Sua principal linguagem do amor e:"));
var rl=mk("p","result-lang");rl.textContent=L.e+" "+L.n;d.appendChild(rl);
var rd=mk("div","result-desc");rd.innerHTML="Voce se sente amado(a) "+L.d;d.appendChild(rd);
ord.forEach(function(e,i){
var row=mk("div","bar-row");var lbl=mk("div","bar-label");
var s1=mk("span");s1.textContent=(i+1)+"o "+LANGS[e[0]].e+" "+LANGS[e[0]].n;
var s2=mk("span");s2.textContent=e[1]+" pts";
lbl.appendChild(s1);lbl.appendChild(s2);row.appendChild(lbl);
var bar=mk("div","bar"+(i===0?" top":""));var fill=mk("div");fill.dataset.w=Math.round(e[1]/MAX*100);bar.appendChild(fill);row.appendChild(bar);d.appendChild(row);
});
d.appendChild(mk("p","days-title","📅 Cronograma de 7 dias para o seu conjuge"));
d.appendChild(mk("p","days-sub","Uma acao por dia, na sua linguagem do amor:"));
CK[top].forEach(function(item,i){var row=mk("div","day-row");row.appendChild(mk("span","day-badge","Dia "+(i+1)));row.appendChild(mk("span","day-text",item));d.appendChild(row);});
var bWA=mk("button","btn","Enviar para meu conjuge no WhatsApp 💌");bWA.addEventListener("click",enviarWA);d.appendChild(bWA);
d.appendChild(mk("p","footer-note","Abre o WhatsApp com mensagem pronta + cronograma."));
var bR=mk("button","btn secondary","Refazer o quiz 💑");bR.addEventListener("click",reiniciar);d.appendChild(bR);
d.appendChild(mk("p","footer-note","E lhes darei um so coracao... 2 Coracoes, 1 So Proposito"));
app.innerHTML="";app.appendChild(d);
requestAnimationFrame(function(){document.querySelectorAll(".bar > div").forEach(function(b){b.style.width=Math.min(100,b.dataset.w)+"%";});});
}
function reiniciar(){idx=0;pl={A:0,B:0,C:0,D:0,E:0};telaPergunta();}
function enviarWA(){
var ord=Object.entries(pl).sort(function(a,b){return b[1]-a[1];});var top=ord[0][0],L=LANGS[top];
var dias=CK[top].map(function(item,i){return "◻️ *Dia "+(i+1)+":* "+item;}).join("\n");
var pts=ord.map(function(e,i){return (i+1)+"o "+LANGS[e[0]].e+" "+LANGS[e[0]].n+" - "+e[1]+" pts";}).join("\n");
var msg="💌 *Uma mensagem para voce, meu amor*\n\nFiz o quiz das 5 Linguagens do Amor.\n\n"+L.e+" *Minha linguagem: "+L.n+"*\n\nEu me sinto amado(a) "+L.eu+"\n\n📊 *Pontuacao:*\n"+pts+"\n\n📅 *Cronograma de 7 dias:*\n"+dias+"\n\n💍 *Combinado:* a cada dia cumprido, me mande um ✅!\n\n*2 Coracoes, 1 So Proposito*";
window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
}
telaPergunta();
</script>
</body>
</html>
