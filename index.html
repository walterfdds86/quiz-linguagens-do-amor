<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - As 5 Linguagens do Amor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;1,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--berry:#6D2E46;--deep:#55243A;--rose:#A26769;--blush:#F1E4E6;--ink:#473640;--muted:#8C7A82;--white:#FFFFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Karla',sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--deep) 0%,var(--berry) 55%,#7d3a52 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--white);width:100%;max-width:540px;border-radius:22px;box-shadow:0 18px 50px rgba(40,12,25,.35);overflow:hidden}
.inner{padding:30px 26px 28px}
.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:.68rem;font-weight:700;color:var(--rose);text-align:center;margin-bottom:4px}
.hearts{display:flex;justify-content:center;margin-bottom:10px}
.hearts svg{width:30px;height:30px}
.hearts svg:last-child{margin-left:-9px}
.progress-wrap{display:flex;align-items:center;gap:12px;margin:14px 0 22px}
.progress{flex:1;height:8px;background:var(--blush);border-radius:99px;overflow:hidden}
.progress>div{height:100%;width:0%;background:var(--rose);border-radius:99px;transition:width .35s ease}
.count{font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap}
.qtitle{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--berry);text-align:center;margin-bottom:4px}
.qsub{text-align:center;color:var(--muted);font-size:.84rem;margin-bottom:20px}
.opt{display:block;width:100%;text-align:left;background:var(--blush);border:2px solid transparent;border-radius:16px;padding:18px;margin-bottom:13px;cursor:pointer;font:500 1rem/1.5 'Karla',sans-serif;color:var(--ink);transition:border-color .15s,background .15s,transform .12s}
.opt:hover{border-color:var(--rose)}
.opt:active{transform:scale(.985)}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.result-name{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:4px}
.result-lang{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:700;color:var(--berry);text-align:center;line-height:1.25;margin-bottom:14px}
.result-desc{background:var(--blush);border-radius:14px;padding:15px 17px;font-size:.92rem;line-height:1.6;margin-bottom:20px}
.result-desc strong{color:var(--berry)}
.bar-row{margin-bottom:11px}
.bar-label{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;margin-bottom:5px}
.bar-label span:last-child{color:var(--muted);font-weight:500}
.bar{height:10px;background:var(--blush);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--rose);border-radius:99px;width:0%;transition:width .8s ease .15s}
.bar.top>div{background:var(--berry)}
.days-title{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:700;color:var(--berry);margin:20px 0 4px;text-align:center}
.days-sub{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:12px}
.day-row{display:flex;align-items:flex-start;gap:10px;background:var(--blush);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.day-badge{flex:none;background:var(--berry);color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.04em;border-radius:99px;padding:4px 9px;margin-top:1px;white-space:nowrap}
.day-text{font-size:.86rem;line-height:1.45}
.btn{display:block;width:100%;margin-top:18px;padding:14px;border:none;border-radius:14px;background:#1faa55;color:#fff;font:700 1rem 'Karla',sans-serif;cursor:pointer;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(.92)}
.btn:active{transform:scale(.98)}
.btn.secondary{background:transparent;color:var(--berry);border:1.5px solid var(--berry);margin-top:10px}
.footer-note{text-align:center;font-size:.74rem;color:var(--muted);margin-top:14px;font-style:italic}
</style>
</head>
<body>
<main class="card" id="app"></main>
<script>
var LANGS={A:{nome:"Palavras de Afirmacao",emoji:"💬",desc:"Voce se sente amado(a) atraves de <strong>palavras</strong>: elogios sinceros, encorajamento e reconhecimento.",descEu:"Eu me sinto amado(a) atraves de palavras: elogios sinceros, encorajamento e reconhecimento."},B:{nome:"Tempo de Qualidade",emoji:"⏰",desc:"Voce se sente amado(a) com <strong>atencao total</strong>. Nao basta estar no mesmo lugar.",descEu:"Eu me sinto amado(a) com atencao total. Preciso de presenca verdadeira: momentos so nossos."},C:{nome:"Presentes",emoji:"🎁",desc:"Voce se sente amado(a) com <strong>gestos visiveis de cuidado</strong>. Nao e o valor, e a mensagem: eu pensei em voce.",descEu:"Eu me sinto amado(a) com gestos visiveis de cuidado. Nao e o valor, e a mensagem: eu pensei em voce."},D:{nome:"Atos de Servico",emoji:"🤝",desc:"Para voce, <strong>amor e ajuda pratica</strong>. Quando seu conjuge assume uma tarefa, isso comunica amor.",descEu:"Para mim, amor e ajuda pratica. Quando voce assume uma tarefa ou cuida de mim, isso me comunica amor."},E:{nome:"Toque Fisico",emoji:"🤗",desc:"Voce se sente amado(a) com <strong>proximidade fisica</strong>: abracos, maos dadas, um carinho ao passar.",descEu:"Eu me sinto amado(a) com proximidade fisica: abracos, maos dadas. O seu toque me comunica seguranca e amor."}};
var CHECKS={A:["Me elogie com algo especifico hoje","Diga eu te amo antes de sair","Me envie uma mensagem carinhosa no meio do dia","Agradeca por algo que eu fiz","Reconheca um esforco meu em voz alta","Deixe um bilhete escrito a mao","Evite criticas asperas, corrija com gentileza"],B:["Reserve 15 min de conversa comigo, sem celular","Planeje um encontro a dois esta semana","Faca uma refeicao comigo com atencao total","Pergunte como foi o meu dia e escute","Faca comigo algo que eu gosto","Caminhe comigo, nem que seja no quarteirao","Guarde o celular quando eu estiver falando"],C:["Me surpreenda com uma lembrancinha sem motivo","Traga o meu doce ou comida favorita","Anote o que eu menciono querer","Marque nossas datas especiais no calendario","Capriche na entrega mesmo em algo simples","Traga algo simbolico quando sair ou viajar","Faca um presente com as proprias maos"],D:["Assuma uma tarefa sem que eu peca","Prepare o cafe ou refeicao para mim","Resolva algo pendente ha tempos","Me ajude com as criancas num dia cansativo","Cuide de um detalhe pratico: carro, contas","Pergunte: o que posso fazer para te ajudar?","Cumpra o que prometeu"],E:["Me abrace ao chegar e ao sair","Ande de maos dadas comigo","Sente-se pertinho de mim no sofa","Faca um carinho em mim, sem pressa","Me de um beijo de bom dia e boa noite","Toque meu ombro ao passar","Vamos adormecer abracados"]};
var PERGUNTAS=[["A","Receber um elogio sincero do meu conjuge.","B","Ter um tempo so nosso, sem interrupcoes."],["C","Ganhar uma lembrancinha inesperada.","D","Ver meu conjuge me ajudando sem eu pedir."],["E","Receber um abraco demorado ao chegar em casa.","A","Ouvir: eu tenho orgulho de voce."],["B","Fazer um passeio a dois, so nos.","C","Receber um presente que mostra que pensaram em mim."],["D","Chegar em casa e ver que meu conjuge resolveu algo por mim.","E","Andar de maos dadas."],["A","Receber uma mensagem carinhosa no meio do dia.","C","Encontrar uma surpresinha que meu conjuge deixou."],["B","Conversar profundamente sobre a vida, sem pressa.","D","Ter ajuda concreta quando estou sobrecarregado(a)."],["E","Receber carinho enquanto assistimos algo juntos.","B","Ter a atencao total do meu conjuge, celular de lado."],["A","Ser encorajado(a) quando estou inseguro(a).","D","Ver meu conjuge cuidando de algo para facilitar minha vida."],["C","Perceber que meu conjuge guardou algo que eu mencionei querer.","E","Adormecer abracados."]];
var idx=0,placar={A:0,B:0,C:0,D:0,E:0},app=document.getElementById("app");
var H='<div class="hearts"><svg viewBox="0 0 24 24" fill="#A26769"><path d="M12 21s-7.5-4.9-10-9.2C.4 8.6 2 5 5.5 5 7.7 5 9.3 6.3 12 9c2.7-2.7 4.3-4 6.5-4C22 5 23.6 8.6 22 11.8 19.5 16.1 12 21 12 21z"/><\/svg><svg viewBox="0 0 24 24" fill="#F1E4E6"><path d="M12 21s-7.5-4.9-10-9.2C.4 8.6 2 5 5.5 5 7.7 5 9.3 6.3 12 9c2.7-2.7 4.3-4 6.5-4C22 5 23.6 8.6 22 11.8 19.5 16.1 12 21 12 21z"/><\/svg><\/div>';
function render(){telaPergunta();}
function responder(l){placar[l]++;idx++;if(idx<PERGUNTAS.length)telaPergunta();else telaResultado();}
function telaPergunta(){var p=PERGUNTAS[idx],pct=Math.round((idx/PERGUNTAS.length)*100),ops=idx%2===1?[[p[2],p[3]],[p[0],p[1]]]:[[p[0],p[1]],[p[2],p[3]]];
var btns=ops.map(function(o){var b=document.createElement("button");b.className="opt";b.dataset.lang=o[0];b.textContent=o[1];b.addEventListener("click",function(){responder(this.dataset.lang);});return b;});
var d=document.createElement("div");d.className="inner fade";d.innerHTML=H+'<p class="eyebrow">As 5 Linguagens do Amor<\/p><div class="progress-wrap"><div class="progress"><div id="pb"><\/div><\/div><span class="count">'+(idx+1)+' \/ '+PERGUNTAS.length+'<\/span><\/div><p class="qtitle">E mais significativo para mim...<\/p><p class="qsub">Toque na opcao que mais fala ao seu coracao:<\/p>';
btns.forEach(function(b){d.appendChild(b);});
app.innerHTML="";app.appendChild(d);
requestAnimationFrame(function(){var b=document.getElementById("pb");if(b)b.style.width=pct+"%";});}
function telaResultado(){var ord=Object.entries(placar).sort(function(a,b){return b[1]-a[1];});var top=ord[0][0],L=LANGS[top],MAX=4;
var d=document.createElement("div");d.className="inner fade";
d.innerHTML=H+'<p class="eyebrow">Resultado<\/p><p class="result-name">Sua principal linguagem do amor e:<\/p><p class="result-lang">'+L.emoji+' '+L.nome+'<\/p><div class="result-desc">'+L.desc+'<\/div>'+ord.map(function(e,i){return '<div class="bar-row"><div class="bar-label"><span>'+(i+1)+'o '+LANGS[e[0]].emoji+' '+LANGS[e[0]].nome+'<\/span><span>'+e[1]+' pts<\/span><\/div><div class="bar '+(i===0?'top':'')+'"><div data-w="'+Math.round((e[1]\/MAX)*100)+'"><\/div><\/div><\/div>';}).join("")+'<p class="days-title">📅 Cronograma de 7 dias para o seu conjuge<\/p><p class="days-sub">Uma acao por dia, na sua linguagem do amor:<\/p>'+CHECKS[top].map(function(item,i){return '<div class="day-row"><span class="day-badge">Dia '+(i+1)+'<\/span><span class="day-text">'+item+'<\/span><\/div>';}).join("")+'<p class="footer-note">E lhes darei um so coracao... 2 Coracoes, 1 So Proposito<\/p>';
var btnWA=document.createElement("button");btnWA.className="btn";btnWA.textContent="Enviar para meu conjuge no WhatsApp 💌";btnWA.addEventListener("click",enviarWhatsApp);
var btnR=document.createElement("button");btnR.className="btn secondary";btnR.textContent="Refazer o quiz 💑";btnR.addEventListener("click",reiniciar);
d.appendChild(btnWA);d.appendChild(btnR);
app.innerHTML="";app.appendChild(d);
requestAnimationFrame(function(){document.querySelectorAll(".bar > div").forEach(function(b){b.style.width=Math.min(100,b.dataset.w)+"%";});});}
function reiniciar(){idx=0;placar={A:0,B:0,C:0,D:0,E:0};telaPergunta();}
function enviarWhatsApp(){var ord=Object.entries(placar).sort(function(a,b){return b[1]-a[1];});var top=ord[0][0],L=LANGS[top];var itens=CHECKS[top].map(function(item,i){return "◻️ *Dia "+(i+1)+":* "+item;}).join("\n");var ranking=ord.map(function(e,i){return (i+1)+"o "+LANGS[e[0]].emoji+" "+LANGS[e[0]].nome+" - "+e[1]+" pts";}).join("\n");var msg="💌 *Uma mensagem para voce, meu amor*\n\nAcabei de fazer o quiz das 5 Linguagens do Amor.\n\n"+L.emoji+" *A minha linguagem do amor e: "+L.nome+"*\n\n"+L.descEu+"\n\n📊 *Como pontuei:*\n"+ranking+"\n\n📅 *Cronograma de 7 dias:*\n"+itens+"\n\n💍 *Combinado:* a cada dia cumprido, me mande um ✅. No 7o dia, me conte qual acao voce mais gostou!\n\n\"E lhes darei um so coracao...\"\n*2 Coracoes, 1 So Proposito*";window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");}
telaPergunta();
</script>
</body>
</html>
